# Whose job boards we watch.
#
# Add a company: find its careers page and check which hiring system it uses —
#   boards.greenhouse.io/<board> or job-boards.greenhouse.io/<board>  → ats: greenhouse
#   jobs.lever.co/<board>                                             → ats: lever   (EU boards: board: "eu:<board>")
#   jobs.ashbyhq.com/<board>                                          → ats: ashby
#   jobs.smartrecruiters.com/<board>                                  → ats: smartrecruiters
#   <board>.jobs.personio.de                                          → ats: personio (.com boards: board: "<board>.com")
# Test it first:  python -m ghostjobs check <ats> <board>

site:
