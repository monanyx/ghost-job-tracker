name: Ghost check

# Every night: read every job board, save what changed, publish the website.

on:
  schedule:
    - cron: "41 3 * * *"   # every night at 03:41 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["companies.yaml", "ghostjobs/**"]

permissions:
  contents: write
  pages: write
  id-token: write

env:
  PYTHONUNBUFFERED: "1"

concurrency:
  group: ghost-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Tests
        run: python -m pytest -q

      - name: Read every job board
        run: python -m ghostjobs run

      - name: Save what changed
        run: |
          git config user.name  "ghost-bot"
          git config user.email "ghost-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes to the boards."
          else
            git commit -m "ghost check $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
